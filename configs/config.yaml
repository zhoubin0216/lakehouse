paths:
  raw: data/raw
  lakehouse: data/lakehouse
  metadata: data/metadata
  source_file_registry: data/metadata/source_file_registry
  ingestion_runs: data/metadata/ingestion_runs

data_consumption:
  sample_limit: null
  write_mode: append
  # Bulk-loader option only; manifest-based updates always deduplicate against raw.
  deduplicate_records: false
  checksum_max_bytes: 10485760

data_quality:
  rejected_table_root: rejected

incremental:
  releases_root: data/raw/updates
  state_root: data/metadata/updates
  new_trip_fraction: 0.06
  duplicate_trip_fraction: 0.015
  days: 7
  seed: 2221

monitoring:
  enabled: true

  pipeline_runs_table: monitoring/pipeline_runs
  schema_events_table: monitoring/schema_events

data_integration:
  integrated_taxi_trips_table: integrated/integrated_taxi_trips
  partitions: [pickup_year, pickup_month]

data_aggregation:
  trips_per_borough_table: aggregate/trips_per_borough
  avg_trip_duration_per_day_table: aggregate/avg_trip_duration_per_day
  avg_fare_per_borough_table: aggregate/avg_fare_per_borough

datasets:
  yellow_taxi_trips:
    current_schema_version: 1
    quality_rules:
      pickup_start: "2024-01-01 00:00:00"
      pickup_end_exclusive: "2024-04-01 00:00:00"
      additional_pickup_periods:
        - ["2025-01-01 00:00:00", "2025-01-08 00:00:00"]
      max_trip_duration_seconds: 86400
      max_trip_distance: 500.0
    ingestion_mode: incremental
    source: yellow_tripdata_2024-*.parquet
    raw_table: raw/yellow_taxi_trips
    normal_table: normal/yellow_taxi_trips
    timestamp: pickup_timestamp
    partitions: [pickup_year, pickup_month]
    schema_versions:
      "1":
        format: parquet
        column_types:
          VendorID: int
          tpep_pickup_datetime: timestamp_ntz
          tpep_dropoff_datetime: timestamp_ntz
          passenger_count: bigint
          trip_distance: double
          RatecodeID: bigint
          store_and_fwd_flag: string
          PULocationID: int
          DOLocationID: int
          payment_type: bigint
          fare_amount: double
          extra: double
          mta_tax: double
          tip_amount: double
          tolls_amount: double
          improvement_surcharge: double
          total_amount: double
          congestion_surcharge: double
          Airport_fee: double
        expected_columns:
          - VendorID
          - tpep_pickup_datetime
          - tpep_dropoff_datetime
          - passenger_count
          - trip_distance
          - RatecodeID
          - store_and_fwd_flag
          - PULocationID
          - DOLocationID
          - payment_type
          - fare_amount
          - extra
          - mta_tax
          - tip_amount
          - tolls_amount
          - improvement_surcharge
          - total_amount
          - congestion_surcharge
          - Airport_fee
        columns:
          VendorID: vendor_id
          tpep_pickup_datetime: pickup_timestamp
          tpep_dropoff_datetime: dropoff_timestamp
          passenger_count: passenger_count
          trip_distance: trip_distance
          RatecodeID: ratecode_id
          store_and_fwd_flag: store_and_fwd_flag
          PULocationID: pickup_location_id
          DOLocationID: dropoff_location_id
          payment_type: payment_type
          fare_amount: fare_amount
          total_amount: total_amount
          congestion_surcharge: congestion_surcharge
          Airport_fee: airport_fee

  taxi_zone_lookup:
    current_schema_version: 1
    ingestion_mode: incremental
    source: taxi_zone_lookup.csv
    raw_table: raw/taxi_zone_lookup
    normal_table: normal/dim_taxi_zone
    primary_key: [location_id]
    partitions: []
    schema_versions:
      "1":
        format: csv
        read_options:
          header: true
          inferSchema: false
        column_types:
          LocationID: int
          Borough: string
          Zone: string
          service_zone: string
        expected_columns:
          - LocationID
          - Borough
          - Zone
          - service_zone
        columns:
          LocationID: location_id
          Borough: borough
          Zone: zone
          service_zone: service_zone

  weather_hourly:
    current_schema_version: 2
    source_schema_version: 1
    ingestion_mode: incremental
    source: weather.csv
    raw_table: raw/weather_hourly
    normal_table: normal/weather_hourly
    timestamp: event_timestamp
    primary_key: [year, month, day, hour]
    partitions: []
    schema_versions:
      "1": &weather_v1
        format: csv
        read_options:
          header: true
          inferSchema: false
        column_types: &weather_types
          year: int
          month: int
          day: int
          hour: int
          temp: double
          temp_source: string
          rhum: double
          rhum_source: string
          prcp: double
          prcp_source: string
          snwd: double
          snwd_source: string
          wdir: double
          wdir_source: string
          wspd: double
          wspd_source: string
          wpgt: double
          wpgt_source: string
          pres: double
          pres_source: string
          cldc: double
          cldc_source: string
          coco: int
          coco_source: string
        expected_columns:
          - year
          - month
          - day
          - hour
          - temp
          - temp_source
          - rhum
          - rhum_source
          - prcp
          - prcp_source
          - snwd
          - snwd_source
          - wdir
          - wdir_source
          - wspd
          - wspd_source
          - wpgt
          - wpgt_source
          - pres
          - pres_source
          - cldc
          - cldc_source
          - coco
          - coco_source
        columns: {}
      "2":
        <<: *weather_v1
        column_types:
          <<: *weather_types
          humidity: double
        expected_columns: [year, month, day, hour, temp, temp_source, rhum, rhum_source, prcp, prcp_source, snwd, snwd_source, wdir, wdir_source, wspd, wspd_source, wpgt, wpgt_source, pres, pres_source, cldc, cldc_source, coco, coco_source, humidity]

  air_quality:
    current_schema_version: 2
    source_schema_version: 1
    ingestion_mode: incremental
    source: hourly_88101_2024.csv
    raw_table: raw/air_quality
    normal_table: normal/air_quality_hourly
    timestamp: event_timestamp
    partitions: [event_year, event_month]
    schema_versions:
      "1": &air_v1
        format: csv
        read_options:
          header: true
          inferSchema: false
        column_types: &air_types
          State Code: string
          County Code: string
          Site Num: string
          Parameter Code: string
          POC: int
          Latitude: double
          Longitude: double
          Datum: string
          Parameter Name: string
          Date Local: date
          Time Local: string
          Date GMT: date
          Time GMT: string
          Sample Measurement: double
          Units of Measure: string
          MDL: double
          Uncertainty: double
          Qualifier: string
          Method Type: string
          Method Code: string
          Method Name: string
          State Name: string
          County Name: string
          Date of Last Change: date
        expected_columns:
          - State Code
          - County Code
          - Site Num
          - Parameter Code
          - POC
          - Latitude
          - Longitude
          - Datum
          - Parameter Name
          - Date Local
          - Time Local
          - Date GMT
          - Time GMT
          - Sample Measurement
          - Units of Measure
          - MDL
          - Uncertainty
          - Qualifier
          - Method Type
          - Method Code
          - Method Name
          - State Name
          - County Name
          - Date of Last Change
        columns:
          State Code: state_code
          County Code: county_code
          Site Num: site_num
          Parameter Code: parameter_code
          POC: poc
          Latitude: latitude
          Longitude: longitude
          Parameter Name: parameter_name
          Date Local: date_local
          Time Local: time_local
          Date GMT: date_gmt
          Time GMT: time_gmt
          Sample Measurement: sample_measurement
          Units of Measure: units_of_measure
          State Name: state_name
          County Name: county_name
      "2":
        <<: *air_v1
        column_types:
          <<: *air_types
          aqi: double
        expected_columns: [State Code, County Code, Site Num, Parameter Code, POC, Latitude, Longitude, Datum, Parameter Name, Date Local, Time Local, Date GMT, Time GMT, Sample Measurement, Units of Measure, MDL, Uncertainty, Qualifier, Method Type, Method Code, Method Name, State Name, County Name, Date of Last Change, aqi]

benchmark:
  unpartitioned_table: benchmark/taxi_unpartitioned
  borough_partitioned_table: benchmark/taxi_by_pickup_borough
  month_partitioned_table: benchmark/taxi_by_pickup_month
  date_partitioned_table: benchmark/taxi_by_pickup_date

  # Random file-count control strategies. These use pseudo-random bucket
  # partitioning with target Parquet file counts matching the final results
  # of pickup_borough (128), pickup_month (20), and pickup_date (608).
  random_borough_table: benchmark/taxi_random_128_files
  random_month_table: benchmark/taxi_random_20_files
  random_date_table: benchmark/taxi_random_608_files

  random_borough_file_count: 128
  random_month_file_count: 20
  random_date_file_count: 608

  results_file: benchmark/benchmark_results.csv

  write_runs: 3
  warmup_runs: 1
  measured_runs: 5

data_analysis:
  baseline_results_root: analysis/baseline_queries
  baseline_timing_file: analysis/baseline_queries/baseline_query_times.csv
  products:
    catalog_table: analysis/product_catalog
    definitions:
      daily_mobility_summary:
        table: analysis/products/daily_mobility_summary
        schema_version: 1
        partitions: []
        grain: one row per pickup date
        intended_users: municipal mobility planners and operations teams
        description: Daily demand, passenger, distance, duration, revenue, and peak-hour metrics.
        materialization_reason: Avoids repeatedly scanning trip-level data for daily operational reporting.
      taxi_zone_statistics:
        table: analysis/products/taxi_zone_statistics
        schema_version: 1
        partitions: []
        grain: one row per pickup month and taxi zone
        intended_users: transport planners and taxi operators
        description: Monthly demand and trip characteristics for each pickup taxi zone.
        materialization_reason: Reuses an expensive high-cardinality zone aggregation across reports.
      weather_impact_summary:
        table: analysis/products/weather_impact_summary
        schema_version: 2
        partitions: []
        grain: one row per pickup month and weather condition
        intended_users: mobility operations and emergency planning teams
        description: Monthly demand, distance, duration, and fare metrics by named Meteostat weather condition.
        materialization_reason: Makes repeated weather-impact comparisons queryable without rescanning trips.
      air_quality_impact_summary:
        table: analysis/products/air_quality_impact_summary
        schema_version: 1
        partitions: []
        grain: one row per pickup month and PM2.5 category
        intended_users: environmental and transport policy analysts
        description: Monthly mobility metrics grouped into project-defined PM2.5 concentration bands.
        materialization_reason: Standardizes PM2.5 bands and avoids repeated classification and aggregation.
  report:
    output_file: data/reports/task4_data_products_report.html
    title: Urban Mobility Data Products
    subtitle: NYC Yellow Taxi
  optimization_benchmark:
    results_root: analysis/optimization
    warmup_runs: 1
    measured_runs: 5
    max_result_rows: 100000
    absolute_tolerance: 0.00000001
    relative_tolerance: 0.000001
    # Keep the existing platform's four shuffle partitions for now.
    # Any later tuning must use the same initial value in both variants.
    spark_config:
      spark.sql.shuffle.partitions: "4"
    suite:
      blocks: 3
      seed: 2221
      year: 2024
      month: 1
